/* ---------- Agenda (Heute / Woche / Überfällig) ---------- */
function viewAgenda(mode){
  const T=todayISO();let title,groups=[];
  const at=activeTasks();
  if(mode==='today'){
    const list=at.filter(t=>t.dueDate===T&&(state.settings.completedBehavior!=='hide'||!taskCompleted(t)));
    const over=at.filter(t=>dueStatus(t)==='overdue');
    if(over.length)groups.push({label:'Überfällig',iso:null,tasks:sortTasks(over,'priority','desc'),warn:true});
    groups.push({label:'Heute · '+DOW_LONG[parseDate(T).getDay()]+', '+fmtDate(T),iso:T,tasks:sortTasks(list,ui.sortBy,ui.sortDir),today:true});
    const noDate=at.filter(t=>!t.dueDate&&!taskCompleted(t));
    if(noDate.length)groups.push({label:'Ohne Zieltermin',iso:null,tasks:sortTasks(noDate,'priority','desc')});
  }else if(mode==='week'){
    const ws=startOfWeek(new Date());
    for(let i=0;i<7;i++){const iso=addDays(isoDate(ws),i);const list=at.filter(t=>t.dueDate===iso&&(state.settings.completedBehavior!=='hide'||!taskCompleted(t)));
      groups.push({label:DOW_LONG[parseDate(iso).getDay()]+', '+fmtDate(iso),iso,tasks:sortTasks(list,'priority','desc'),today:iso===T});}
  }else{ // overdue
    const list=at.filter(t=>dueStatus(t)==='overdue');
    const byDate={};list.forEach(t=>{(byDate[t.dueDate]=byDate[t.dueDate]||[]).push(t);});
    Object.keys(byDate).sort().forEach(iso=>groups.push({label:fmtDate(iso)+' · vor '+Math.abs(daysBetween(T,iso))+' Tagen',iso,tasks:sortTasks(byDate[iso],'priority','desc'),warn:true}));
    if(!list.length)return emptyState('alert','Nichts überfällig','Alle Aufgaben mit Zieltermin sind rechtzeitig.');
  }
  const hasAny=groups.some(g=>g.tasks.length);
  if(!hasAny&&mode!=='overdue')return emptyState('today','Keine Aufgaben','Für diesen Zeitraum ist nichts geplant.');
  const body=groups.filter(g=>g.tasks.length||g.today).map(g=>
    '<div class="agenda-day"><div class="agenda-dh"><span class="d'+(g.today?' is-today':'')+'"'+(g.warn?' style="color:var(--overdue)"':'')+'>'+esc(g.label)+'</span><span class="c">'+g.tasks.length+'</span><span class="line"></span></div>'+
    '<div class="agenda-list">'+(g.tasks.length?g.tasks.map(t=>renderCard(t,{showArea:true})).join(''):'<div class="empty-mini">Nichts geplant.</div>')+'</div></div>'
  ).join('');
  return '<div class="agenda">'+body+'</div>';
}
function bindAgenda(){
  $$('.agenda .card').forEach(c=>c.addEventListener('click',e=>{
    if(e.target.closest('[data-act="toggle"]')){const t=state.tasks.find(x=>x.id===c.dataset.id);toggleComplete(t);renderView();refreshBadges();return;}
    if(cardClickSub(e,c))return;
    openDetail(c.dataset.id);
  }));
}

/* ---------- Archiv ---------- */
function viewArchive(){
  const list=state.tasks.filter(t=>t.archived).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  const done=activeTasks().filter(t=>taskCompleted(t)).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0));
  let html='<div class="agenda">';
  html+='<div class="agenda-day"><div class="agenda-dh"><span class="d">Erledigt (aktiv im Board)</span><span class="c">'+done.length+'</span><span class="line"></span></div>'+
    '<div class="agenda-list">'+(done.length?done.map(t=>renderCard(t,{showArea:true})).join(''):'<div class="empty-mini">Keine erledigten Aufgaben.</div>')+'</div></div>';
  html+='<div class="agenda-day"><div class="agenda-dh"><span class="d">Archiviert</span><span class="c">'+list.length+'</span><span class="line"></span>'+
    (list.length?'<button class="btn btn-sm btn-ghost" id="unarchAll">Alle wiederherstellen</button>':'')+'</div>'+
    '<div class="agenda-list">'+(list.length?list.map(t=>renderCard(t,{showArea:true})).join(''):'<div class="empty-mini">Das Archiv ist leer.</div>')+'</div></div>';
  html+='</div>';
  return html;
}
function bindArchive(){
  $$('.agenda .card').forEach(c=>c.addEventListener('click',e=>{if(e.target.closest('[data-act="toggle"]')){const t=state.tasks.find(x=>x.id===c.dataset.id);toggleComplete(t);renderView();refreshBadges();return;}if(cardClickSub(e,c))return;openDetail(c.dataset.id);}));
  const u=$('#unarchAll');if(u)u.onclick=()=>{state.tasks.forEach(t=>{if(t.archived)t.archived=false;});save();renderView();refreshBadges();toast('Archiv wiederhergestellt');};
}

/* ---------- Papierkorb ---------- */
function viewTrash(){
  if(!state.trash.length)return emptyState('trash','Papierkorb ist leer','Gelöschte Aufgaben landen hier und können wiederhergestellt werden.');
  const rows=state.trash.map(t=>{const b=boardById(t.boardId);
    return '<tr data-id="'+t.id+'"><td><div class="t-title">'+esc(t.title)+'</div></td>'+
      '<td class="cell-muted">'+(b?esc(b.name):'—')+'</td>'+
      '<td class="cell-muted">gelöscht '+relTime(t._deletedAt)+'</td>'+
      '<td style="text-align:right;white-space:nowrap"><button class="btn btn-sm btn-ghost" data-restore="'+t.id+'">'+icon('restore')+'Wiederherstellen</button> <button class="btn btn-sm btn-danger" data-purge="'+t.id+'">'+icon('trash')+'</button></td></tr>';
  }).join('');
  return '<div class="list-wrap"><div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-sm btn-danger" id="emptyTrash">'+icon('trash')+'Papierkorb leeren</button></div>'+
    '<table class="tbl"><thead><tr><th>Aufgabe</th><th>Board</th><th>Gelöscht</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function bindTrash(){
  $$('[data-restore]').forEach(b=>b.onclick=()=>{restoreTask(b.dataset.restore);renderView();refreshBadges();toast('Aufgabe wiederhergestellt');});
  $$('[data-purge]').forEach(b=>b.onclick=()=>{confirmDialog('Endgültig löschen?','Diese Aufgabe wird unwiderruflich entfernt.',()=>{purgeTask(b.dataset.purge);renderView();refreshBadges();});});
  const e=$('#emptyTrash');if(e)e.onclick=()=>confirmDialog('Papierkorb leeren?','Alle Aufgaben im Papierkorb werden unwiderruflich gelöscht.',()=>{state.trash=[];save();renderView();refreshBadges();});
}
</script>
<script>
/* ---------- Generische Dialoge ---------- */
function ensureOverlay(){let o=$('#overlay');if(!o){o=document.createElement('div');o.id='overlay';o.className='overlay';document.body.appendChild(o);o.onclick=()=>{if(!o._lock)closeAllModals();};}return o;}
function closeAllModals(){closeModal();closeDetail();}
function showOverlay(lock){const o=ensureOverlay();o._lock=!!lock;requestAnimationFrame(()=>o.classList.add('show'));}
function hideOverlayIfIdle(){if(!$('#genModal')&&!(($('#detailPanel')||{}).classList||{contains:()=>false}).contains?.('show')){const o=$('#overlay');if(o)o.classList.remove('show');}}
function openModalHTML(title,bodyHTML,footerHTML,narrow){
  closeModal();showOverlay();
  const m=document.createElement('div');m.className='modal'+(narrow?' narrow':'');m.id='genModal';
  m.innerHTML='<div class="dh"><h3>'+esc(title)+'</h3><button class="close" id="mClose">'+icon('x')+'</button></div>'+
    '<div class="db">'+bodyHTML+'</div>'+(footerHTML?'<div class="df">'+footerHTML+'</div>':'');
  document.body.appendChild(m);requestAnimationFrame(()=>m.classList.add('show'));
  $('#mClose',m).onclick=closeModal;
  return m;
}
function closeModal(){const m=$('#genModal');if(m){m.classList.remove('show');setTimeout(()=>m.remove(),180);}const o=$('#overlay');if(o&&!isDetailOpen())o.classList.remove('show');}
function promptDialog(title,value,cb,placeholder){
  const m=openModalHTML(title,'<div class="field"><input class="input" id="pdIn" value="'+esc(value||'')+'" placeholder="'+esc(placeholder||'')+'"></div>',
    '<div class="spacer"></div><button class="btn" id="pdCancel">Abbrechen</button><button class="btn btn-primary" id="pdOk">Speichern</button>',true);
  const inp=$('#pdIn',m);inp.focus();inp.select();
  const ok=()=>{const v=inp.value.trim();closeModal();cb(v);};
  $('#pdOk',m).onclick=ok;$('#pdCancel',m).onclick=closeModal;
  inp.onkeydown=e=>{if(e.key==='Enter')ok();};
}
function confirmDialog(title,text,cb,danger){
  const m=openModalHTML(title,'<p style="color:var(--muted);line-height:1.6">'+esc(text)+'</p>',
    '<div class="spacer"></div><button class="btn" id="cCancel">Abbrechen</button><button class="btn '+(danger===false?'btn-primary':'btn-danger')+'" id="cOk">'+(danger===false?'OK':'Löschen')+'</button>',true);
  $('#cOk',m).onclick=()=>{closeModal();cb();};$('#cCancel',m).onclick=closeModal;
}

/* ---------- Aufgaben-Formular (geteilt) ---------- */
function boardOptions(sel){return state.areas.map(a=>'<optgroup label="'+esc(a.name)+'">'+state.boards.filter(b=>b.areaId===a.id).map(b=>'<option value="'+b.id+'"'+(b.id===sel?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</optgroup>').join('');}
function columnOptions(boardId,sel){const b=boardById(boardId);if(!b)return'';return b.columns.map(c=>'<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.name)+'</option>').join('');}
function prioSeg(sel){return '<div class="seg prio">'+Object.keys(PRIOS).map(k=>'<button type="button" data-prio data-v="'+k+'" class="'+(k===sel?'on':'')+'">'+PRIOS[k].label+'</button>').join('')+'</div>';}

function taskFormFields(t){
  return ''+
  '<div class="field"><label>Board</label><select class="select" data-f="boardId">'+boardOptions(t.boardId)+'</select></div>'+
  '<div class="row"><div class="field"><label>Spalte / Status</label><select class="select" data-f="columnId" id="ffCol">'+columnOptions(t.boardId,t.columnId)+'</select></div>'+
  '<div class="field"><label>Kategorie</label><input class="input" data-f="category" list="catList" value="'+esc(t.category)+'" placeholder="z. B. Projekt"><datalist id="catList">'+allCategories().map(c=>'<option value="'+esc(c)+'">').join('')+'</datalist></div></div>'+
  '<div class="field"><label>Priorität</label>'+prioSeg(t.priority)+'</div>'+
  '<div class="row"><div class="field"><label>Startdatum</label><input class="input" type="date" data-f="startDate" value="'+esc(t.startDate)+'"></div>'+
  '<div class="field"><label>Zieltermin</label><input class="input" type="date" data-f="dueDate" value="'+esc(t.dueDate)+'"></div>'+
  '<div class="field" style="max-width:120px"><label>Uhrzeit</label><input class="input" type="time" data-f="dueTime" value="'+esc(t.dueTime)+'"></div></div>'+
  '<div class="row"><div class="field"><label>Wiederholung</label><select class="select" data-f="recurType" id="ffRecur">'+Object.keys(RECUR).map(k=>'<option value="'+k+'"'+(t.recurrence.type===k?' selected':'')+'>'+RECUR[k]+'</option>').join('')+'</select></div>'+
  '<div class="field" id="ffRecurExtra">'+recurExtra(t)+'</div></div>'+
  '<div class="row"><div class="field"><label>Erinnerung</label><select class="select" data-f="remType" id="ffRem">'+
    ['none','before','custom'].map(k=>'<option value="'+k+'"'+(t.reminder.type===k?' selected':'')+'>'+({none:'Keine',before:'Vor Deadline',custom:'Fester Vorlauf'}[k])+'</option>').join('')+'</select></div>'+
  '<div class="field" id="ffRemExtra">'+remExtra(t)+'</div></div>'+
  '<div class="field"><label>Geschätzter Aufwand (Minuten)</label><input class="input" type="number" min="0" step="5" data-f="estimate" value="'+(t.estimate!=null?t.estimate:'')+'" placeholder="z. B. 30" style="max-width:160px"></div>';
}
function recurExtra(t){
  if(t.recurrence.type==='custom')return '<label>Alle N Tage</label><input class="input" type="number" min="1" data-f="recurInterval" value="'+(t.recurrence.interval||2)+'" style="max-width:120px">';
  if(t.recurrence.type==='weekdays'){const days=t.recurrence.days||[1,2,3,4,5];return '<label>Wochentage</label><div class="seg gen" data-dowseg>'+[1,2,3,4,5,6,0].map(d=>'<button type="button" data-dow="'+d+'" class="'+(days.includes(d)?'on':'')+'">'+DOW[d]+'</button>').join('')+'</div>';}
  return '<label>&nbsp;</label><div style="color:var(--faint);font-size:12.5px;padding-top:10px">'+(t.recurrence.type==='none'?'Einmalige Aufgabe':'Beim Erledigen wird die nächste Aufgabe erzeugt')+'</div>';
}
function remExtra(t){
  if(t.reminder.type==='none')return '<label>&nbsp;</label><div style="color:var(--faint);font-size:12.5px;padding-top:10px">Ohne Erinnerung</div>';
  const presets=[10,30,60,1440];const cur=t.reminder.minutes||30;
  return '<label>Vorlaufzeit</label><select class="select" data-f="remMinutes">'+presets.map(p=>'<option value="'+p+'"'+(cur===p?' selected':'')+'>'+(p<60?p+' Min.':(p===60?'1 Stunde':'1 Tag'))+' vorher</option>').join('')+
    '<option value="custom"'+(!presets.includes(cur)?' selected':'')+'>Benutzerdefiniert…</option></select>'+
    (!presets.includes(cur)?'<input class="input" type="number" min="1" data-f="remCustom" value="'+cur+'" style="margin-top:6px" placeholder="Minuten vorher">':'');
}

/* Änderungen aus dem Formular auf ein (temporäres oder echtes) Task-Objekt anwenden */
function readFormInto(root,t,onChange){
  const setF=(el)=>{
    const f=el.dataset.f;let v=el.type==='number'?(el.value===''?null:+el.value):el.value;
    if(f==='estimate')v=el.value===''?null:+el.value;
    if(f==='boardId'){const nb=boardById(v);t.boardId=v;if(nb){t.areaId=nb.areaId;if(!nb.columns.find(c=>c.id===t.columnId))t.columnId=nb.columns[0].id;$('#ffCol',root).innerHTML=columnOptions(v,t.columnId);}onChange&&onChange('boardId');return;}
    if(f==='recurType'){t.recurrence={type:v};if(v==='custom')t.recurrence.interval=2;if(v==='weekdays')t.recurrence.days=[1,2,3,4,5];$('#ffRecurExtra',root).innerHTML=recurExtra(t);bindRecurExtra(root,t,onChange);onChange&&onChange('recur');return;}
    if(f==='recurInterval'){t.recurrence.interval=+el.value||1;onChange&&onChange();return;}
    if(f==='remType'){t.reminder={type:v};if(v!=='none')t.reminder.minutes=30;$('#ffRemExtra',root).innerHTML=remExtra(t);bindRemExtra(root,t,onChange);onChange&&onChange();return;}
    if(f==='remMinutes'){if(el.value==='custom'){t.reminder.minutes=99;$('#ffRemExtra',root).innerHTML=remExtra(t);bindRemExtra(root,t,onChange);}else t.reminder.minutes=+el.value;onChange&&onChange();return;}
    if(f==='remCustom'){t.reminder.minutes=+el.value||1;onChange&&onChange();return;}
    t[f]=v;onChange&&onChange(f);
  };
  $$('[data-f]',root).forEach(el=>{
    const ev=(el.tagName==='SELECT'||el.type==='date'||el.type==='time')?'change':'input';
    el.addEventListener(ev,()=>setF(el));
  });
  $$('[data-prio]',root).forEach(b=>b.onclick=()=>{$$('[data-prio]',root).forEach(x=>x.classList.remove('on'));b.classList.add('on');t.priority=b.dataset.v;onChange&&onChange('priority');});
  bindRecurExtra(root,t,onChange);bindRemExtra(root,t,onChange);
}
function bindRecurExtra(root,t,onChange){
  const seg=$('[data-dowseg]',root);if(seg)$$('[data-dow]',seg).forEach(b=>b.onclick=()=>{b.classList.toggle('on');const days=$$('[data-dow].on',seg).map(x=>+x.dataset.dow);t.recurrence.days=days;onChange&&onChange();});
  const ri=$('[data-f="recurInterval"]',root);if(ri)ri.addEventListener('input',()=>{t.recurrence.interval=+ri.value||1;onChange&&onChange();});
}
function bindRemExtra(root,t,onChange){
  const rm=$('[data-f="remMinutes"]',root);if(rm)rm.addEventListener('change',()=>{if(rm.value==='custom'){t.reminder.minutes=99;$('#ffRemExtra',root).innerHTML=remExtra(t);bindRemExtra(root,t,onChange);}else{t.reminder.minutes=+rm.value;onChange&&onChange();}});
  const rc=$('[data-f="remCustom"]',root);if(rc)rc.addEventListener('input',()=>{t.reminder.minutes=+rc.value||1;onChange&&onChange();});
}

/* ---------- Neue Aufgabe (Modal) ---------- */
function openTaskModal(prefill){
  const s=state.settings;
  const draft=makeTask(Object.assign({
    boardId:(ui.view==='board'&&ui.boardId)?ui.boardId:s.defaultBoardId,
    priority:s.defaultPriority,
    columnId:(boardById((ui.view==='board'&&ui.boardId)?ui.boardId:s.defaultBoardId)||{columns:[{id:'c_in'}]}).columns[0].id
  },prefill||{}));
  const b0=boardById(draft.boardId);if(b0)draft.areaId=b0.areaId;
  const body=
    '<div class="field"><input class="title-input" id="ntTitle" placeholder="Aufgabentitel…"></div>'+
    '<div class="field"><label>Beschreibung</label><textarea class="textarea" data-f="description" placeholder="Details, Kontext, Ziel…">'+esc(draft.description)+'</textarea></div>'+
    '<div id="ntFields">'+taskFormFields(draft)+'</div>';
  const footer='<label class="checkbox-row" style="margin-right:auto" id="ntMore"><span style="font-size:13px;color:var(--muted)">Nach dem Speichern weitere Details ergänzen</span></label>'+
    '<button class="btn" id="ntCancel">Abbrechen</button><button class="btn btn-primary" id="ntSave">'+icon('check')+'Aufgabe anlegen</button>';
  const m=openModalHTML('Neue Aufgabe',body,footer);
  const fields=$('#ntFields',m);
  readFormInto(fields,draft);
  const title=$('#ntTitle',m);title.focus();
  const desc=$('[data-f="description"]',m);desc.addEventListener('input',()=>draft.description=desc.value);
  let openAfter=false;$('#ntMore',m).onclick=()=>{openAfter=!openAfter;$('#ntMore',m).style.opacity=openAfter?1:.6;};$('#ntMore',m).style.opacity=.6;
  const doSave=()=>{const v=title.value.trim();if(!v){title.focus();title.style.boxShadow='0 0 0 2px var(--overdue)';return;}
    draft.title=v;const t=createTask(draft);closeModal();render();
    if(openAfter)openDetail(t.id);else toast('Aufgabe angelegt');};
  $('#ntSave',m).onclick=doSave;$('#ntCancel',m).onclick=closeModal;
  title.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){doSave();}else if(e.key==='Enter'){e.preventDefault();doSave();}});
}

<style>
/* ---------- Sync-Anzeige ---------- */
.sync-row{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:0 8px 6px;
  border-radius:9px;background:var(--surface-2);border:1px solid var(--line);

<script>
/* ================= Geraete-Sync ueber die Artifact-Datenbank =============
   Als Artifact liegt der Stand serverseitig, damit PC, Laptop und Handy
   denselben Bestand sehen. Als lokal geoeffnete Datei existiert
   window.claude nicht - dann bleibt alles wie bisher im localStorage, und
   Export/Import/Zusammenfuehren ist weiter der Weg zwischen Geraeten.

   Zusammenfuehren statt ueberschreiben: Schreibt ein anderes Geraet, waehrend
   wir offen sind, laeuft der Fernstand durch mergeImport() - dieselbe
   getestete Logik wie beim Datei-Import (Abgleich ueber IDs, bei Konflikt
   gewinnt die zuletzt geaenderte Fassung). Es geht also nichts verloren.
   Preis dieser Richtung: Eine auf Geraet A geloeschte Aufgabe kann von
   Geraet B zurueckkommen, solange B sie noch kennt. Nichts zu verlieren ist
   uns wichtiger als nichts zurueckzubekommen.
   ====================================================================== */

const SYNC_PATH='state/board';
const CLIENT_ID=uid();
let cloudDoc=null;        // DocumentReference oder null
let cloudRev=0;           // Stand, auf dem unsere Daten beruhen
let cloudUnsub=null;
let cloudBusy=false,cloudQueued=false,cloudMute=false;
let syncCls='',syncTxt='Nur dieses Geraet',syncIcon='cloudoff';

function isArtifact(){
  try{return !!(window.claude&&typeof window.claude.use==='function');}catch(e){return false;}
}
function clockStr(){const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes());}
function setSync(cls,txt,ic){
  syncCls=cls;syncTxt=txt;syncIcon=ic||'cloud';
  const el=document.getElementById('syncRow');
  if(el){el.className='sync-row '+cls;el.innerHTML=icon(syncIcon)+'<span class="st">'+esc(txt)+'</span>';el.title=txt;}
}
function syncRowHtml(){
  if(!isArtifact())return '';
  return '<div class="sync-row '+syncCls+'" id="syncRow" title="'+esc(syncTxt)+'">'+icon(syncIcon)+'<span class="st">'+esc(syncTxt)+'</span></div>';
}
/* Frischer, unberuehrter Stand? Dann darf der Fernstand ihn ersetzen,
   statt Beispieldaten hineinzumischen. */
function localIsFresh(){
  return !state.tasks.length && !state.trash.length && state.settings.firstRun;
}
function adoptRemote(r){
  const def=defaultState();
  state=Object.assign(def,r);
  ['areas','boards','tasks','savedViews','notifications','trash'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=def[k];});
  if(!state.notifiedKeys)state.notifiedKeys={};
  if(!state.settings)state.settings=def.settings;
  else state.settings=Object.assign({},def.settings,state.settings);
  state.tasks.forEach(normalizeTask);state.trash.forEach(normalizeTask);
  repairTaskRefs();
  saveRaw();
}
function parseCloud(d){
  if(!d||typeof d.json!=='string')return null;
  try{const o=JSON.parse(d.json);return (o&&typeof o==='object')?o:null;}catch(e){return null;}
}
/* Fernstand einarbeiten. Gibt true zurueck, wenn sich lokal etwas geaendert hat. */
function applyRemote(remote,initial){
  if(initial&&localIsFresh()){adoptRemote(remote);return true;}
  cloudMute=true;
  let rep=null;
  try{rep=mergeImport(remote);}catch(e){console.warn('Zusammenfuehren fehlgeschlagen',e);}
  finally{cloudMute=false;}
  if(!rep)return false;
  return !!(rep.tasks||rep.updated||rep.areas||rep.boards||rep.columns||rep.views||rep.trash);
}
async function cloudInit(){
  if(!isArtifact())return;
  setSync('s-busy','Verbinde mit dem Speicher…','cloud');
  let db=null;
  try{db=await window.claude.use('db');}catch(e){db=null;}
  if(!db){setSync('','Nur dieses Geraet','cloudoff');return;}
  try{cloudDoc=db.doc(SYNC_PATH);}
  catch(e){cloudDoc=null;setSync('s-err','Speicherpfad ungueltig','cloudoff');return;}
  let snap=null;
  try{snap=await cloudDoc.get();}
  catch(e){setSync('s-err','Speicher nicht erreichbar ('+((e&&e.code)||'Fehler')+')','cloudoff');cloudDoc=null;return;}
  if(snap&&snap.exists){
    const d=snap.data()||{};
    const remote=parseCloud(d);
    cloudRev=+d.rev||0;
    if(remote&&applyRemote(remote,true)){render();}
    setSync('s-ok','Synchronisiert · '+clockStr(),'cloud');
    // Eigener Stand kann Aufgaben enthalten, die der Fernstand nicht hat
    cloudPush();
  }else{
    setSync('s-busy','Lege Speicher an…','cloud');
    await cloudPush(true);
  }
  try{
    cloudUnsub=cloudDoc.onSnapshot(function(sn){
      if(!sn||!sn.exists)return;
      if(sn.metadata&&sn.metadata.hasPendingWrites)return;   // eigener, noch offener Schreibvorgang
      const d=sn.data()||{};
      const rev=+d.rev||0;
      if(d.writer===CLIENT_ID){if(rev>cloudRev)cloudRev=rev;return;}
      if(rev<=cloudRev)return;
      const remote=parseCloud(d);if(!remote)return;
      cloudRev=rev;
      const changed=applyRemote(remote,false);
      setSync('s-ok','Synchronisiert · '+clockStr(),'cloud');
      if(changed){render();toast('Änderungen von einem anderen Geraet uebernommen');cloudPush();}
    },function(e){
      setSync('s-err','Sync unterbrochen ('+((e&&e.code)||'Fehler')+')','cloudoff');
    });
  }catch(e){/* ohne Live-Updates weiterarbeiten */}
}
async function cloudPush(force){
  if(!cloudDoc||cloudMute)return;
  if(cloudBusy){cloudQueued=true;return;}
  cloudBusy=true;
  try{
    // Hat ein anderes Geraet seit unserem Stand geschrieben? Erst einarbeiten.
    if(!force){
      let cur=null;
      try{cur=await cloudDoc.get();}catch(e){cur=null;}
      if(cur&&cur.exists){
        const d=cur.data()||{};
        const rev=+d.rev||0;
        if(rev>cloudRev&&d.writer!==CLIENT_ID){
          const remote=parseCloud(d);
          if(remote){cloudRev=rev;if(applyRemote(remote,false))render();}
        }else if(rev>cloudRev){cloudRev=rev;}
      }
    }
    const rev=cloudRev+1;
    setSync('s-busy','Speichere…','cloud');
    await cloudDoc.set({json:JSON.stringify(state),rev:rev,writer:CLIENT_ID,at:Date.now()});
    cloudRev=rev;
    setSync('s-ok','Gespeichert · '+clockStr(),'cloud');
  }catch(e){
    const c=(e&&e.code)||'';
    setSync('s-err',c==='resource_exhausted'?'Zu viele Aenderungen – kurz warten':('Nicht gespeichert ('+(c||'Fehler')+')'),'cloudoff');
  }finally{
    cloudBusy=false;
    if(cloudQueued){cloudQueued=false;setTimeout(function(){cloudPush();},400);}
  }
}
const cloudSaveSoon=debounce(function(){cloudPush();},900);
</script>

<script>
/* ================= Termin in Outlook ====================================
   Oeffnet ein vorausgefuelltes Outlook-Terminfenster. Gespeichert wird der
   Termin erst, wenn der Nutzer in Outlook selbst auf Speichern drueckt.

   Bewusst KEINE .ics-Datei: Als Artifact laeuft die Seite in einer Sandbox,
   die von der Seite ausgeloeste Downloads unterdrueckt; .ics steht ausserdem
   nicht auf der erlaubten Dateiendungs-Liste. Der Deeplink ist eine normale
   Verlinkung und kommt deshalb durch.

   Kein Extra-Schalter pro Aufgabe: Der Knopf erscheint genau dann, wenn ein
   Zieltermin gesetzt ist. Ohne Datum gibt es nichts in den Kalender zu legen.
   ====================================================================== */

function calDuration(t){
  const c=t.cal||{};
  return (+c.dur>0?+c.dur:0) || (+t.estimate>0?+t.estimate:0) || (+(state.settings.calDefaultMin)>0?+state.settings.calDefaultMin:30);
}
function calIsAllDay(t){return !t.dueTime;}
function p2(n){return String(n).padStart(2,'0');}
function calLocalStamp(d){
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes())+':00';
}
/* Start/Ende als LOKALE Zeitangabe ohne Z-Suffix - Outlook legt den Termin
   dann in der Zeitzone des Nutzers an. Mit Z-Suffix waere er um den
   UTC-Versatz verschoben (im Sommer zwei Stunden). */
function calRange(t){
  if(!t.dueDate)return null;
  if(calIsAllDay(t)){
    return {start:t.dueDate+'T00:00:00',end:addDays(t.dueDate,1)+'T00:00:00',allday:true};
  }
  const parts=String(t.dueTime).split(':');
  const d=parseDate(t.dueDate);if(!d)return null;
  d.setHours(+parts[0]||0,+parts[1]||0,0,0);
  const e=new Date(d.getTime()+calDuration(t)*60000);
  return {start:calLocalStamp(d),end:calLocalStamp(e),allday:false};
}
function calWhenText(t){
  const r=calRange(t);if(!r)return '';
  if(r.allday)return fmtDate(t.dueDate)+' · ganztaegig';
  const e=new Date(parseDate(t.dueDate).getTime());
  const parts=String(t.dueTime).split(':');
  e.setHours(+parts[0]||0,+parts[1]||0,0,0);
  const end=new Date(e.getTime()+calDuration(t)*60000);
  return fmtDate(t.dueDate)+' · '+t.dueTime+'–'+p2(end.getHours())+':'+p2(end.getMinutes())+' ('+calDuration(t)+' Min.)';
}
/* Termintext: Beschreibung, Unteraufgaben, Notizen, Links, Herkunft */
function calBody(t){
  const L=[];
  if(t.description)L.push(t.description);
  if(t.subtasks&&t.subtasks.length){
    L.push('');L.push('Unteraufgaben:');
    t.subtasks.forEach(x=>L.push((x.done?'[x] ':'[ ] ')+x.text));
  }
  if(t.notes){L.push('');L.push('Notizen:');L.push(t.notes);}
  if(t.links&&t.links.length){L.push('');L.push('Links:');t.links.forEach(l=>L.push(l));}
  const meta=[];
  const a=areaById(t.areaId),b=boardById(t.boardId);
  if(a)meta.push(a.name);
  if(b&&(!a||b.name!==a.name))meta.push(b.name);
  if(t.category)meta.push(t.category);
  if(t.priority&&t.priority!=='normal')meta.push('Prioritaet: '+PRIOS[t.priority].label);
  if(t.tags&&t.tags.length)meta.push(t.tags.join(', '));
  if(meta.length){L.push('');L.push('— '+meta.join(' · ')+' (aus dem Kanban-Board)');}
  return L.join('\n');
}
function outlookBase(){
  return (state.settings.outlookHost==='live')
    ? 'https://outlook.live.com/calendar/0/deeplink/compose'
    : 'https://outlook.office.com/calendar/0/deeplink/compose';
}
function outlookUrl(t){
  const r=calRange(t);if(!r)return null;
  const e=encodeURIComponent;
  const q=['path='+e('/calendar/action/compose'),'rru=addevent',
           'subject='+e(t.title||'Aufgabe'),
           'startdt='+e(r.start),'enddt='+e(r.end)];
  if(r.allday)q.push('allday=true');
  const loc=(t.cal&&t.cal.loc)||'';
  if(loc)q.push('location='+e(loc));
  const body=calBody(t);
  if(body)q.push('body='+e(body));
  return outlookBase()+'?'+q.join('&');
}
/* Notnagel, falls der Deeplink im jeweiligen Outlook nicht greift */
function calPlainText(t){
  const L=['Betreff: '+(t.title||'Aufgabe'),'Zeit: '+calWhenText(t)];
  const loc=(t.cal&&t.cal.loc)||'';
  if(loc)L.push('Ort: '+loc);
  const body=calBody(t);
  if(body){L.push('');L.push(body);}
  return L.join('\n');
}
function copyText(txt,okMsg){
  const done=()=>toast(okMsg||'Kopiert');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,()=>fallback());
  }else fallback();
  function fallback(){
    try{
      const ta=document.createElement('textarea');
      ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done();
    }catch(e){toast('Kopieren nicht moeglich');}
  }
}
/* Kleiner Knopf auf der Karte - nur bei offenen Aufgaben mit Zieltermin. */
function cardCalBtn(t){
  if(!t.dueDate||taskCompleted(t))return '';
  const url=outlookUrl(t);if(!url)return '';
  return '<a class="cal-mini" data-act="cal" href="'+esc(url)+'" target="_blank" rel="noopener" '+
         'title="Termin in Outlook oeffnen – '+esc(calWhenText(t))+'">'+icon('calendar')+'Outlook</a>';
}
/* Abschnitt im Detailpanel */
function calSection(t){
  if(!t.dueDate){
    return '<div class="section-title">'+icon('calendar')+'Termin</div>'+
      '<div class="cal-box"><div class="cal-note">Setze oben einen <b>Zieltermin</b> – dann kannst du die Aufgabe von hier aus als Outlook-Termin oeffnen. '+
      'Ohne Uhrzeit wird daraus ein ganztaegiger Termin.</div></div>';
  }
  const url=outlookUrl(t);
  const c=t.cal||{dur:null,loc:''};
  return '<div class="section-title">'+icon('calendar')+'Termin</div>'+
    '<div class="cal-box">'+
      '<div class="cal-when">'+esc(calWhenText(t))+'</div>'+
      '<div class="cal-note">'+(calIsAllDay(t)
          ? 'Ohne Uhrzeit → ganztaegiger Termin. Trage oben eine Uhrzeit ein, wenn du eine feste Zeit willst.'
          : 'Outlook oeffnet ein vorausgefuelltes Terminfenster. Gespeichert wird erst, wenn du dort auf Speichern drueckst.')+'</div>'+
      '<div class="row" style="margin-top:9px">'+
        '<div class="field" style="max-width:150px"><label>Dauer (Minuten)</label>'+
          '<input class="input" type="number" min="5" step="5" id="dCalDur" value="'+(c.dur!=null?c.dur:'')+'" placeholder="'+calDuration(t)+'"'+(calIsAllDay(t)?' disabled':'')+'></div>'+
        '<div class="field"><label>Ort (optional)</label>'+
          '<input class="input" id="dCalLoc" value="'+esc(c.loc||'')+'" placeholder="Raum, Teams-Link, Adresse…"></div>'+
      '</div>'+
      '<div class="cal-actions">'+
        '<a class="btn btn-primary" id="dCalOpen" href="'+esc(url)+'" target="_blank" rel="noopener">'+icon('calendar')+'In Outlook oeffnen</a>'+
        '<button class="btn" id="dCalCopy">'+icon('copy')+'Termintext kopieren</button>'+
      '</div>'+
    '</div>';
}
function bindCalSection(t,p,onChange){
  const dur=$('#dCalDur',p);
  if(dur)dur.addEventListener('input',()=>{
    const v=+dur.value;
    t.cal.dur=(v>0)?v:null;
    save();onChange&&onChange();
  });
  const loc=$('#dCalLoc',p);
  if(loc)loc.addEventListener('input',()=>{t.cal.loc=loc.value;save();onChange&&onChange();});
  const cp=$('#dCalCopy',p);
  if(cp)cp.onclick=()=>copyText(calPlainText(t),'Termintext kopiert');
}
</script>
<script>
/* ---------- Detailansicht (Seitenpanel) ---------- */
function isDetailOpen(){const p=$('#detailPanel');return p&&p.classList.contains('show');}
function closeDetail(){const p=$('#detailPanel');if(p){p.classList.remove('show');setTimeout(()=>p.remove(),240);}ui.detailId=null;const o=$('#overlay');if(o&&!$('#genModal'))o.classList.remove('show');
  // Ansicht auffrischen, damit Änderungen sichtbar werden
  if(ui.view==='board')mountBoard();else refreshContent();refreshBadges();}
function openDetail(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  ui.detailId=id;showOverlay();
  let p=$('#detailPanel');if(p)p.remove();
  p=document.createElement('aside');p.className='panel-detail';p.id='detailPanel';
  document.body.appendChild(p);renderDetail(t);
  requestAnimationFrame(()=>p.classList.add('show'));
}
function renderDetail(t){
  const p=$('#detailPanel');if(!p)return;
  const done=taskCompleted(t);const prog=subtaskProgress(t);
  p.innerHTML=
    '<div class="dh">'+
      '<button class="card-check'+(done?' done':'')+'" id="dToggle" title="Erledigt umschalten" style="width:22px;height:22px">'+icon('check')+'</button>'+
      '<h3 style="flex:1;font-size:15px;color:var(--muted)">'+(done?'Erledigt':'Aufgabe bearbeiten')+'</h3>'+
      '<button class="close" id="dMenu">'+icon('dots')+'</button>'+
      '<button class="close" id="dClose">'+icon('x')+'</button>'+
    '</div>'+
    '<div class="db" id="dBody">'+
      '<textarea class="title-input" id="dTitle" rows="1" style="width:100%;resize:none;overflow:hidden;margin-bottom:14px" placeholder="Titel…">'+esc(t.title)+'</textarea>'+
      '<div class="field"><label>Beschreibung</label><textarea class="textarea" data-f="description" placeholder="Beschreibung…">'+esc(t.description)+'</textarea></div>'+
      '<div id="dFields">'+taskFormFields(t)+'</div>'+
      // Termin (Outlook)
      '<div id="dCal">'+calSection(t)+'</div>'+
      // Unteraufgaben
      '<div class="section-title">'+icon('checklist')+'Unteraufgaben'+(prog?' · '+prog.done+'/'+prog.total:'')+'</div>'+
      '<div class="subtasks" id="dSubs">'+t.subtasks.map(s=>subtaskRow(s)).join('')+
        '<div class="add-row">'+icon('plusSm')+'<input id="dSubAdd" placeholder="Unteraufgabe hinzufügen…"></div></div>'+
      // Tags
      '<div class="section-title">'+icon('tag')+'Tags</div>'+
      '<div class="taglist" id="dTags">'+t.tags.map(tg=>tagChip(tg)).join('')+'<input class="tag-input" id="dTagAdd" placeholder="Tag +"></div>'+
      // Links
      '<div class="section-title">'+icon('link')+'Links & Anhänge</div>'+
      '<div id="dLinks">'+t.links.map((l,i)=>linkRow(l,i)).join('')+'</div>'+
      '<div class="add-row" style="padding-left:0">'+icon('plusSm')+'<input id="dLinkAdd" placeholder="URL oder Dateiverweis einfügen…"></div>'+
      // Notizen
      '<div class="section-title">'+icon('note')+'Notizen</div>'+
      '<textarea class="textarea" data-f="notes" placeholder="Zusätzliche Notizen…">'+esc(t.notes)+'</textarea>'+
      // Historie
      '<div class="section-title">'+icon('clock')+'Verlauf</div>'+
      '<div class="history">'+[...t.history].reverse().map(h=>'<div class="hist-item"><span class="hdot"></span><span>'+esc(HIST_LABEL[h.type]||h.type)+(h.detail?': '+esc(h.detail):'')+'</span><span class="htime">'+fmtDateTime(h.t)+'</span></div>').join('')+'</div>'+
    '</div>';
  bindDetail(t);
}
function subtaskRow(s){return '<div class="subtask'+(s.done?' done':'')+'" data-sid="'+s.id+'"><button class="card-check'+(s.done?' done':'')+'" data-stcheck>'+icon('check')+'</button><input class="st-text" value="'+esc(s.text)+'"><button class="del" data-stdel>'+icon('x')+'</button></div>';}
function tagChip(tg){return '<span class="tag" data-tag="'+esc(tg)+'">'+esc(tg)+'<button data-tagdel="'+esc(tg)+'">'+icon('x')+'</button></span>';}
function linkRow(l,i){const isUrl=/^https?:\/\//i.test(l);return '<div class="link-row" data-li="'+i+'">'+icon(isUrl?'link':'paperclip','lk')+(isUrl?'<a href="'+esc(l)+'" target="_blank" rel="noopener">'+esc(l)+'</a>':'<span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(l)+'</span>')+'<button class="del" data-lidel="'+i+'">'+icon('trash')+'</button></div>';}

function bindDetail(t){
  const p=$('#detailPanel');
  const persist=()=>{save();};
  $('#dClose',p).onclick=closeDetail;
  // Titel (auto-grow + speichern)
  const ta=$('#dTitle',p);const grow=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';};grow();
  ta.addEventListener('input',()=>{grow();t.title=ta.value;persist();refreshCalLink();});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ta.blur();}});
  // Beschreibung / Notizen
  $$('[data-f="description"],[data-f="notes"]',p).forEach(el=>el.addEventListener('input',()=>{t[el.dataset.f]=el.value;persist();refreshCalLink();}));
  // nur den Link neu setzen, damit der Cursor im Textfeld nicht springt
  function refreshCalLink(){const a=$('#dCalOpen',p);if(a){const u=outlookUrl(t);if(u)a.href=u;}}
  // Formularfelder
  const redrawCal=()=>{const h=$('#dCal',p);if(h){h.innerHTML=calSection(t);bindCalSection(t,p,()=>redrawCal());}};
  readFormInto($('#dFields',p),t,(field)=>{save();
    // Termin haengt an Datum, Uhrzeit, Aufwand, Titel und Board - neu zeichnen
    if(!field||['dueDate','dueTime','estimate','boardId','priority','category'].includes(field))redrawCal();
  });
  bindCalSection(t,p,()=>redrawCal());
  // Toggle erledigt
  $('#dToggle',p).onclick=()=>{toggleComplete(t);renderDetail(t);};
  // Menü
  $('#dMenu',p).onclick=(e)=>{e.stopPropagation();openMenu(e.currentTarget,[
    {key:'dup',icon:'copy',text:'Duplizieren',fn:()=>{const c=makeTask(Object.assign(clone(t),{id:uid(),completedAt:null,createdAt:Date.now(),history:[{t:Date.now(),type:'created'}]}));c.subtasks=c.subtasks.map(s=>({id:uid(),text:s.text,done:s.done}));state.tasks.unshift(c);save();closeDetail();render();toast('Aufgabe dupliziert');}},
    {key:'arch',icon:'archive',text:t.archived?'Aus Archiv holen':'Archivieren',fn:()=>{t.archived=!t.archived;save();closeDetail();}},
    {sep:true},
    {key:'del',icon:'trash',text:'Löschen',danger:true,fn:()=>{closeDetail();deleteTask(t.id);render();}},
  ],{align:'right'});};
  // Unteraufgaben
  const subsEl=$('#dSubs',p);
  $$('.subtask',subsEl).forEach(row=>{
    const sid=row.dataset.sid;const s=t.subtasks.find(x=>x.id===sid);
    $('[data-stcheck]',row).onclick=()=>{s.done=!s.done;row.classList.toggle('done',s.done);$('[data-stcheck]',row).classList.toggle('done',s.done);persist();};
    $('.st-text',row).addEventListener('input',e=>{s.text=e.target.value;persist();});
    $('[data-stdel]',row).onclick=()=>{t.subtasks=t.subtasks.filter(x=>x.id!==sid);persist();renderDetail(t);};
  });
  const subAdd=$('#dSubAdd',p);subAdd.onkeydown=e=>{if(e.key==='Enter'&&subAdd.value.trim()){t.subtasks.push({id:uid(),text:subAdd.value.trim(),done:false});persist();renderDetail(t);setTimeout(()=>$('#dSubAdd',$('#detailPanel')).focus(),0);}};
  // Tags
  const tagAdd=$('#dTagAdd',p);
  $$('[data-tagdel]',p).forEach(b=>b.onclick=()=>{const tg=b.dataset.tagdel;t.tags=t.tags.filter(x=>x!==tg);persist();renderDetail(t);});
  tagAdd.onkeydown=e=>{if((e.key==='Enter'||e.key===',')&&tagAdd.value.trim()){e.preventDefault();const v=tagAdd.value.trim().replace(/,$/,'');if(v&&!t.tags.includes(v))t.tags.push(v);persist();renderDetail(t);setTimeout(()=>$('#dTagAdd',$('#detailPanel')).focus(),0);}};
  // Links
  const linkAdd=$('#dLinkAdd',p);
  $$('[data-lidel]',p).forEach(b=>b.onclick=()=>{t.links.splice(+b.dataset.lidel,1);persist();renderDetail(t);});
  linkAdd.onkeydown=e=>{if(e.key==='Enter'&&linkAdd.value.trim()){t.links.push(linkAdd.value.trim());persist();renderDetail(t);setTimeout(()=>$('#dLinkAdd',$('#detailPanel')).focus(),0);}};
}
</script>
<script>

/* ---------- Benachrichtigungs-Center ---------- */
function toggleNotifPanel(){

/* Als Einzeldatei reicht ein Download-Link. Als Artifact nicht: Die Sandbox
   laesst von der Seite ausgeloeste Downloads wirkungslos verpuffen - auch mit
   blob:- oder data:-Adresse. Dort geht der Weg ueber die downloads-Faehigkeit,
   bei der der Nutzer den Speichervorgang bestaetigt. */
async function exportData(){
  const json=JSON.stringify(state,null,2);
  const name='kanban-backup-'+todayISO()+'.json';
  if(isArtifact()){
    let dl=null;
    try{dl=await window.claude.use('downloads');}catch(e){dl=null;}
    if(dl){
      try{
        await dl.save({filename:name,data:json});
        toast('Backup gespeichert');
      }catch(e){
        const c=(e&&e.code)||'';
        if(c==='declined')toast('Backup abgebrochen');
        else{copyText(json,'Speichern ging nicht \u2013 Backup in die Zwischenablage kopiert');}
      }
      return;
    }
    copyText(json,'Backup in die Zwischenablage kopiert');
    return;
  }
  try{
    const blob=new Blob([json],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=name;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exportiert');
  }catch(e){copyText(json,'Backup in die Zwischenablage kopiert');}
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const data=JSON.parse(r.result);
      if(!data.tasks||!data.boards){throw new Error('Ungültig');}
      importChoiceDialog(data,f.name);
    }catch(e){toast('Datei konnte nicht gelesen werden');}};
    r.readAsText(f);};
  inp.click();
}

/* ---------- Import: Zusammenführen oder Ersetzen ---------- */
function taskLastChange(t){
  let m=t.createdAt||0;
  (t.history||[]).forEach(h=>{if(h&&typeof h.t==='number'&&h.t>m)m=h.t;});
  if(t.completedAt&&t.completedAt>m)m=t.completedAt;
  return m;
}
function normalizeTask(t){
  t.tags=Array.isArray(t.tags)?t.tags:[];
  t.subtasks=Array.isArray(t.subtasks)?t.subtasks:[];
  t.links=Array.isArray(t.links)?t.links:[];
  t.attachments=Array.isArray(t.attachments)?t.attachments:[];
  t.history=(Array.isArray(t.history)&&t.history.length)?t.history:[{t:t.createdAt||Date.now(),type:'created'}];
  t.recurrence=t.recurrence||{type:'none'};
  t.reminder=t.reminder||{type:'none'};
  t.cal=(t.cal&&typeof t.cal==='object')?t.cal:{dur:null,loc:''};
  if(typeof t.cal.loc!=='string')t.cal.loc='';
  if(t.cal.dur!=null&&!(+t.cal.dur>0))t.cal.dur=null;
  if(!t.createdAt)t.createdAt=Date.now();
  return t;
}
/* Sorgt dafür, dass jede Aufgabe auf ein existierendes Board/Spalte zeigt. */
function repairTaskRefs(){
  const fallback=boardById(state.settings.defaultBoardId)||state.boards[0];
  if(!fallback)return;
  state.tasks.concat(state.trash).forEach(t=>{
    let b=boardById(t.boardId);
    if(!b){b=fallback;t.boardId=b.id;}
    t.areaId=b.areaId;
    if(!b.columns.some(c=>c.id===t.columnId)&&b.columns[0])t.columnId=b.columns[0].id;
  });
}
function mergeImport(data){
  const clone=o=>JSON.parse(JSON.stringify(o));
  const rep={tasks:0,updated:0,areas:0,boards:0,columns:0,views:0,trash:0};
  // Bereiche: gleiche ID = gleicher Bereich
  (Array.isArray(data.areas)?data.areas:[]).forEach(a=>{
    if(!a||!a.id)return;
    if(!state.areas.some(x=>x.id===a.id)){state.areas.push(clone(a));rep.areas++;}
  });
  // Boards: neue anlegen, bei bekannten nur fehlende Spalten ergänzen
  (Array.isArray(data.boards)?data.boards:[]).forEach(b=>{
    if(!b||!b.id)return;
    const ex=state.boards.find(x=>x.id===b.id);
    if(!ex){
      const nb=clone(b);
      if(!Array.isArray(nb.columns)||!nb.columns.length)nb.columns=defaultColumns();
      if(!state.areas.some(a=>a.id===nb.areaId))nb.areaId=state.areas[0]?state.areas[0].id:nb.areaId;
      state.boards.push(nb);rep.boards++;
    }else{
      (Array.isArray(b.columns)?b.columns:[]).forEach(c=>{
        if(c&&c.id&&!ex.columns.some(x=>x.id===c.id)){ex.columns.push(clone(c));rep.columns++;}
      });
    }
  });
  // Aufgaben: nach ID abgleichen, bei Konflikt gewinnt die zuletzt geänderte
  const byId={};state.tasks.forEach(t=>{byId[t.id]=t;});
  (Array.isArray(data.tasks)?data.tasks:[]).forEach(t=>{
    if(!t||!t.id)return;
    const cp=normalizeTask(clone(t));
    const ex=byId[cp.id];
    if(!ex){state.tasks.push(cp);byId[cp.id]=cp;rep.tasks++;}
    else if(taskLastChange(cp)>taskLastChange(ex)){Object.assign(ex,cp);rep.updated++;}
  });
  (Array.isArray(data.savedViews)?data.savedViews:[]).forEach(v=>{
    if(v&&v.id&&!state.savedViews.some(x=>x.id===v.id)){state.savedViews.push(clone(v));rep.views++;}
  });
  (Array.isArray(data.trash)?data.trash:[]).forEach(t=>{
    if(t&&t.id&&!byId[t.id]&&!state.trash.some(x=>x.id===t.id)){state.trash.push(normalizeTask(clone(t)));rep.trash++;}
  });
  repairTaskRefs();
  save();
  return rep;
}
function importChoiceDialog(data,fileName){
  const n=Array.isArray(data.tasks)?data.tasks.length:0;
  const m=openModalHTML('Backup einlesen',

    '<p style="color:var(--muted);line-height:1.7;margin-top:12px"><b style="color:var(--ink)">Zusammenführen</b> ergänzt die vorhandenen Daten – so liegen private und berufliche Aufgaben gemeinsam in dieser App. Bereits vorhandene Aufgaben werden erkannt; bei Unterschieden gewinnt die zuletzt geänderte Fassung.</p>'+
    '<p style="color:var(--muted);line-height:1.7;margin-top:10px"><b style="color:var(--overdue)">Ersetzen</b> verwirft alles, was aktuell in diesem Browser liegt.</p>',
    '<button class="btn btn-danger" id="imReplace">Ersetzen</button><div class="spacer"></div><button class="btn" id="imCancel">Abbrechen</button><button class="btn btn-primary" id="imMerge">'+icon('merge')+'Zusammenführen</button>');
  $('#imCancel',m).onclick=closeModal;
  $('#imMerge',m).onclick=()=>{const rep=mergeImport(data);closeModal();ui.view='dashboard';ui.boardId=null;ui.savedViewId=null;render();setTimeout(()=>importReport(rep),220);};
  $('#imReplace',m).onclick=()=>{closeModal();setTimeout(()=>confirmDialog('Wirklich ersetzen?','Alle aktuellen Aufgaben in diesem Browser werden durch das Backup ersetzt.',()=>{
    state=Object.assign(defaultState(),data);state.settings.firstRun=false;state.tasks.forEach(normalizeTask);repairTaskRefs();save();
    ui.view='dashboard';ui.boardId=null;ui.savedViewId=null;render();toast('Import erfolgreich');}),220);};
}
function importReport(rep){
  const line=(l,v)=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line-2)"><span style="color:var(--muted)">'+l+'</span><b style="color:'+(v?'var(--ink)':'var(--faint)')+'">'+v+'</b></div>';
  const m=openModalHTML('Zusammengeführt',
    line('Neue Aufgaben',rep.tasks)+line('Aktualisierte Aufgaben',rep.updated)+line('Neue Bereiche',rep.areas)+
    line('Neue Boards',rep.boards)+line('Ergänzte Spalten',rep.columns)+line('Neue Ansichten',rep.views)+line('Papierkorb',rep.trash),
    '<div class="spacer"></div><button class="btn btn-primary" id="irOk">Fertig</button>',true);
  $('#irOk',m).onclick=closeModal;
}

/* ---------- PWA (best effort, offline-fähig) ---------- */
function setupPWA(){
  try{
    const manifest={name:'Aufgaben – Kanban',short_name:'Aufgaben',start_url:'.',display:'standalone',background_color:'#F4F5F7',theme_color:'#3E5DAB',icons:[]};
    const mBlob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(mBlob);document.head.appendChild(link);
  }catch(e){}
  // Service Worker nur unter https/localhost sinnvoll; Fehler ignorieren
  if('serviceWorker'in navigator&&location.protocol==='https:'){
    const sw="self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{});";
    try{const b=new Blob([sw],{type:'text/javascript'});navigator.serviceWorker.register(URL.createObjectURL(b)).catch(()=>{});}catch(e){}
  }
}

/* =========================================================================
   Einfache Anmeldung ("billiger Login") – rein clientseitig.
   Standard-Zugang: siehe AUTH_DEFAULT. Änderbar unter Einstellungen › Zugang.
   HINWEIS: Das ist KEIN echter Schutz. Die Datei und der Browser-Speicher
   sind lesbar – die Sperre hält nur Gelegenheitsblicke fern.
   ========================================================================= */
const AUTH_DEFAULT={user:'Vladi',pass:'12345'};
const AUTH_CFG_KEY='kanban_auth_cfg_v1';
const AUTH_SESSION_KEY='kanban_auth_session_v1';

function lsGet(k){try{const v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}return memoryStore['ls:'+k]||null;}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}memoryStore['ls:'+k]=v;}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}delete memoryStore['ls:'+k];}
function ssGet(k){try{const v=sessionStorage.getItem(k);if(v!==null)return v;}catch(e){}return memoryStore['ss:'+k]||null;}
function ssSet(k,v){try{sessionStorage.setItem(k,v);}catch(e){}memoryStore['ss:'+k]=v;}
function ssDel(k){try{sessionStorage.removeItem(k);}catch(e){}delete memoryStore['ss:'+k];}

function authCfg(){
  try{const s=lsGet(AUTH_CFG_KEY);if(s){const o=JSON.parse(s);if(o&&typeof o.user==='string'&&o.user)return{user:o.user,pass:String(o.pass==null?'':o.pass)};}}catch(e){}
  return{user:AUTH_DEFAULT.user,pass:AUTH_DEFAULT.pass};
}
function setAuthCfg(u,p){lsSet(AUTH_CFG_KEY,JSON.stringify({user:u,pass:p}));}
function isLoggedIn(){return ssGet(AUTH_SESSION_KEY)==='1'||lsGet(AUTH_SESSION_KEY)==='1';}
function setLoggedIn(remember){if(remember){lsSet(AUTH_SESSION_KEY,'1');ssDel(AUTH_SESSION_KEY);}else{ssSet(AUTH_SESSION_KEY,'1');lsDel(AUTH_SESSION_KEY);}}
function logout(){lsDel(AUTH_SESSION_KEY);ssDel(AUTH_SESSION_KEY);try{location.reload();}catch(e){}}

var LOGIN_CB=null,LOGIN_DONE=false;
function showLogin(onOk){
  LOGIN_CB=onOk;
  const g=document.createElement('div');g.id='loginGate';
  g.innerHTML='<div class="login-card" id="lgCard">'+
    '<div class="login-brand"><div class="lg-logo">'+icon('logo')+'</div><div><b>Aufgaben</b><small>Kanban-Planer &middot; Arbeit &amp; Privat</small></div></div>'+
    '<div class="login-err" id="lgErr"></div>'+
    '<div class="field"><label for="lgUser">Benutzername</label>'+
      '<input class="input" id="lgUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" onkeydown="lgKey(event)"></div>'+
    '<div class="field"><label for="lgPass">Passwort</label>'+
      '<input class="input" id="lgPass" name="password" type="password" autocomplete="current-password" onkeydown="lgKey(event)"></div>'+
    '<label class="login-remember"><input type="checkbox" id="lgRemember" checked>Auf diesem Ger&auml;t angemeldet bleiben</label>'+
    '<button class="btn btn-primary" type="button" id="lgGo" onclick="loginTry()">'+icon('lock')+'Anmelden</button>'+
    '<div class="login-note">Einfache Zugangssperre ohne Verschl&uuml;sselung &ndash; h&auml;lt Gelegenheitsblicke fern, ersetzt aber keinen echten Schutz. '+
      'Zugangsdaten &auml;nderbar unter Einstellungen &rsaquo; Zugang.<br>'+
      '<span id="lgVer">Version 1.3</span> &middot; '+
      '<a href="#" id="lgSkip" onclick="loginSkip();return false;">Anmeldung &uuml;berspringen</a></div>'+
  '</div>';
  document.body.appendChild(g);
  // Zusaetzliche Bindung (die Inline-Handler oben funktionieren auch ohne diesen Block)
  try{
    const b=document.getElementById('lgGo');
    if(b)b.addEventListener('click',function(e){e.preventDefault();loginTry();});
    const s=document.getElementById('lgSkip');
    if(s)s.addEventListener('click',function(e){e.preventDefault();loginSkip();});
  }catch(e){}
  setTimeout(function(){const f=document.getElementById('lgUser');if(f)f.focus();},60);
}
/* Globale Handler – bewusst als einfache Funktionen, damit die Inline-Attribute
   im Markup sie in jedem Browser finden, auch wenn eine Bindung scheitert. */
function lgFail(msg){
  const e=document.getElementById('lgErr'),c=document.getElementById('lgCard');
  if(e){e.textContent=msg;e.className='login-err show';}
  if(c){c.className='login-card';void c.offsetWidth;c.className='login-card shake';}
}
function lgKey(ev){
  const k=ev&&(ev.key||ev.keyCode);
  if(k==='Enter'||k===13){if(ev.preventDefault)ev.preventDefault();loginTry();}
}
function lgStart(remember){
  if(LOGIN_DONE)return;
  LOGIN_DONE=true;
  try{
    if(remember!==null)setLoggedIn(remember);
    if(typeof LOGIN_CB==='function')LOGIN_CB();
    const g=document.getElementById('loginGate');
    if(g){g.style.opacity='0';setTimeout(function(){if(g.parentNode)g.parentNode.removeChild(g);},220);}
  }catch(err){
    LOGIN_DONE=false;
    lgFail('Fehler beim Start: '+(err&&err.message?err.message:err));
  }
}
function loginTry(){
  try{
    const uEl=document.getElementById('lgUser'),pEl=document.getElementById('lgPass');
    if(!uEl||!pEl){lgFail('Anmeldefelder nicht gefunden.');return;}
    const cfg=authCfg();
    const u=String(uEl.value||'').trim(),p=String(pEl.value||'').trim();
    if(u.toLowerCase()!==String(cfg.user).trim().toLowerCase()||p!==String(cfg.pass).trim()){
      pEl.value='';pEl.focus();
      lgFail('Benutzername oder Passwort ist falsch.');return;
    }
    const rem=document.getElementById('lgRemember');
    lgStart(rem?!!rem.checked:true);
  }catch(err){
    lgFail('Fehler beim Anmelden: '+(err&&err.message?err.message:err));
  }
}
function loginSkip(){lgStart(null);}

/* ---------- Initialisierung ---------- */
function init(){
  // Vorschau-/Sandbox-Umgebungen (z. B. veroeffentlichter Link) koennen nicht
  // speichern. Dort ist eine Anmeldung sinnlos und wuerde nur blockieren.
  if(!persistent){startApp();return;}
  // Als Artifact schuetzt bereits der Claude-Zugang die Adresse; eine zweite,
  // unverschluesselte Sperre davor waere nur Reibung ohne Gewinn.
  if(isArtifact()){startApp();return;}
  if(isLoggedIn())startApp();
  else showLogin(startApp);
}
function startApp(){
  const raw=loadRaw();
  if(raw){state=Object.assign(defaultState(),raw);
    // Migrationssicherung
    ['areas','boards','tasks','savedViews','notifications','trash'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=defaultState()[k];});
    if(!state.notifiedKeys)state.notifiedKeys={};
    state.tasks.forEach(normalizeTask);
    state.trash.forEach(normalizeTask);
    repairTaskRefs();
  }else{
    state=defaultState();
  }
  autoArchive();
  render();
  cloudInit();
  if(state.settings.firstRun){setTimeout(firstRunDialog,200);}
  setupPWA();
  // Benachrichtigungen periodisch prüfen
  checkReminders();
  setInterval(checkReminders,60000);
  // Datumswechsel abfangen (Mitternacht): jede Minute Fälligkeiten aktualisieren
  let lastDay=todayISO();
  setInterval(()=>{const d=todayISO();if(d!==lastDay){lastDay=d;if(['board','today','week','overdue','dashboard'].includes(ui.view))render();}},60000);
}
init();
</script>
